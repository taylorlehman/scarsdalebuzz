<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Scarsdale Buzz</title>
    <link rel="icon" type="image/png" href="images/logos/bee_favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
        ::selection { background-color: #D4D2CD; color: black; }
        
        /* Floating animation for the bee */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .floating-bee {
            animation: float 6s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen bg-[#F9F8F4] text-[#2C2C2C] flex flex-col">

    <!-- Navigation (Simplified) -->
    <nav class="w-full px-6 md:px-12 py-8 flex justify-center items-center">
        <a href="/" class="font-serif text-2xl tracking-tight hover:opacity-80 transition-opacity">
            Scarsdale<span class="italic text-[#666]">Buzz</span>
        </a>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center px-6 text-center -mt-20">
        
        <div class="floating-bee text-8xl md:text-9xl mb-8 select-none">
            🐝
        </div>

        <h1 class="font-serif text-5xl md:text-7xl mb-6 text-[#1A1A1A]">
            Oh, hives!
        </h1>
        
        <p class="text-lg md:text-xl text-[#666] max-w-lg mb-10 leading-relaxed font-light">
            It seems you've flown a bit too far from the nest. This page doesn't exist, but don't worry—our worker bees can guide you back.
        </p>

        <div class="flex flex-col sm:flex-row gap-4">
            <a href="/" class="bg-[#2C2C2C] text-[#F9F8F4] px-8 py-4 text-sm md:text-base font-medium rounded-sm hover:bg-black transition-all inline-flex items-center gap-2 group">
                Fly Back Home
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="group-hover:-translate-x-1 transition-transform"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            <a href="/directory" class="bg-transparent border border-[#CCC] text-[#2C2C2C] px-8 py-4 text-sm md:text-base font-medium rounded-sm hover:border-black transition-all">
                Browse Directory
            </a>
        </div>

        <div class="mt-16 text-xs text-[#AAA] tracking-widest uppercase">
            Error 404 — Page Not Found
        </div>

    </main>

    <!-- Footer (Simplified) -->
    <footer class="py-8 text-center text-xs text-[#888]">
        <p>&copy; <script>document.write(new Date().getFullYear())</script> Scarsdale Buzz</p>
    </footer>

</body>
</html>
