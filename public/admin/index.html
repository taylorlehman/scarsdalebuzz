<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin • Scarsdale Services Directory</title>
  <link rel="icon" type="image/png" href="../images/scarsdale_services_directory.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css" />
  <!-- Firebase compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
  <script src="../firebase-config.js"></script>
</head>
<body class="antialiased bg-[#f7e9cf] min-h-screen p-4">
  <div class="max-w-6xl mx-auto">
    <!-- Header card to match site style -->
    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-2xl mb-6">
      <div class="flex items-center gap-4">
        <div class="w-20 h-20 rounded-full bg-[#f7e9cf] p-1 flex items-center justify-center" style="border: 4px solid #81503f;">
          <img src="../images/scarsdale_services_directory.png" alt="Logo" class="w-12 h-12" />
        </div>

    
        <div>
          <h1 class="font-brand text-3xl font-black text-stone-800">Admin Dashboard</h1>
          <p class="text-stone-600">Manage services and categories</p>
        </div>
        <div class="ml-auto flex items-center gap-3">
          <div class="flex flex-wrap gap-2 mr-3">
            <button id="toggleServices" class="px-4 py-2 rounded-full text-sm font-semibold transition brand-secondary-bg-hover brand-secondary-bg text-stone-700">Manage Services</button>
            <button id="toggleCategories" class="px-4 py-2 rounded-full text-sm font-semibold transition border border-stone-300">Manage Categories</button>
          </div>
          <a href="../index.html" class="text-sm underline hover:text-stone-800">Back to Directory</a>
        </div>
      </div>
    </div>

    <!-- CATEGORIES PANEL -->
    <div id="categoriesPanel" class="grid grid-cols-1 lg:grid-cols-2 gap-6 hidden">
      <!-- Groups management -->
      <div class="bg-white p-6 rounded-2xl shadow-lg">
        <h2 class="text-xl font-bold mb-4">Category Groups</h2>
        <div id="groupList" class="space-y-2 mb-4"></div>
        <form id="addGroupForm" class="flex gap-2 mt-2">
          <input id="newGroupName" type="text" class="flex-1 p-3 border-2 border-stone-300 rounded-lg" placeholder="New group name" />
          <button class="brand-accent-bg text-white font-bold py-2 px-4 rounded-lg brand-accent-bg-hover">Add Group</button>
        </form>
        <hr class="my-6" />
        <div>
          <h3 class="font-semibold mb-2">Edit Selected Group</h3>
          <form id="editGroupForm" class="space-y-3">
            <input type="hidden" id="editGroupOriginalName" />
            <div>
              <label class="block text-sm font-semibold mb-1">Group Name</label>
              <input id="editGroupName" type="text" class="w-full p-3 border-2 border-stone-300 rounded-lg" />
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">Associated Categories</label>
              <div id="groupCategoriesChooser" class="grid grid-cols-2 gap-2 max-h-64 overflow-auto border rounded p-2"></div>
            </div>
            <div class="flex items-center gap-2">
              <button class="brand-accent-bg text-white font-bold py-2 px-4 rounded-lg brand-accent-bg-hover" id="saveGroupBtn" type="submit">Save Group</button>
              <button class="py-2 px-4 rounded-lg border" id="clearGroupSelectionBtn" type="button">Clear</button>
              <button class="py-2 px-4 rounded-lg border border-red-300 text-red-600" id="deleteGroupBtn" type="button">Delete Group</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Categories management -->
      <div class="bg-white p-6 rounded-2xl shadow-lg">
        <h2 class="text-xl font-bold mb-4">Categories</h2>
        <div id="categoryList" class="space-y-2 mb-4"></div>
        <form id="addCategoryForm" class="grid grid-cols-1 md:grid-cols-3 gap-2 items-end">
          <div class="md:col-span-2">
            <label class="block text-sm font-semibold mb-1">New Category Name</label>
            <input id="newCategoryName" type="text" class="w-full p-3 border-2 border-stone-300 rounded-lg" placeholder="e.g., Electrician" />
          </div>
          <button class="brand-accent-bg text-white font-bold py-2 px-4 rounded-lg brand-accent-bg-hover">Add Category</button>
        </form>
        <hr class="my-6" />
        <div>
          <h3 class="font-semibold mb-2">Edit Selected Category</h3>
          <form id="editCategoryForm" class="space-y-3">
            <input type="hidden" id="editCategoryOriginalName" />
            <div>
              <label class="block text-sm font-semibold mb-1">Category Name</label>
              <input id="editCategoryName" type="text" class="w-full p-3 border-2 border-stone-300 rounded-lg" />
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">Group Association</label>
              <select id="editCategoryGroup" class="w-full p-3 border-2 border-stone-300 rounded-lg">
                <option value="">(Ungrouped)</option>
              </select>
            </div>
            <div class="flex items-center gap-2">
              <button class="brand-accent-bg text-white font-bold py-2 px-4 rounded-lg brand-accent-bg-hover" id="saveCategoryBtn" type="submit">Save Category</button>
              <button class="py-2 px-4 rounded-lg border" id="clearCategorySelectionBtn" type="button">Clear</button>
              <button class="py-2 px-4 rounded-lg border border-red-300 text-red-600" id="deleteCategoryBtn" type="button">Delete Category</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Services Controls -->
    <div id="servicesControls" class="bg-white p-6 rounded-2xl shadow-lg mb-6">
      <div class="flex flex-col md:flex-row gap-4 items-start md:items-end">
        <div class="flex-1 w-full">
          <label class="block text-sm font-semibold text-stone-700 mb-1">Search</label>
          <input id="adminSearch" type="text" class="w-full p-3 border-2 border-stone-300 rounded-lg brand-accent-ring" placeholder="Search by name, business, category, phone, or email..." />
        </div>
        <div class="w-full md:w-64">
          <label class="block text-sm font-semibold text-stone-700 mb-1">Filter by Category</label>
          <select id="adminCategoryFilter" class="w-full p-3 border-2 border-stone-300 rounded-lg">
            <option value="">All</option>
          </select>
        </div>
        
      </div>
    </div>

    <!-- SERVICES PANEL -->
    <div id="servicesPanel" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- Services list -->
      <div class="bg-white p-4 rounded-2xl shadow-lg">
        <div class="overflow-x-auto">
          <table class="min-w-full text-sm">
            <thead>
              <tr class="text-left text-stone-600 border-b">
                <th class="py-2 pr-4">Name / Business</th>
                <th class="py-2 pr-4">Category</th>
                <th class="py-2 pr-4">Phone</th>
                <th class="py-2 pr-4">Email</th>
                <th class="py-2 pr-4">Recs</th>
                <th class="py-2">Actions</th>
              </tr>
            </thead>
            <tbody id="adminTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Editor form -->
      <div class="bg-white p-6 rounded-2xl shadow-lg">
        <h2 id="formTitle" class="text-xl font-bold mb-4">Add New Listing</h2>
        <form id="listingForm" class="space-y-3">
          <input type="hidden" id="docId" />
          <div>
            <label class="block text-sm font-semibold mb-1">Business Name</label>
            <input id="businessName" type="text" class="w-full p-3 border-2 border-stone-300 rounded-lg" />
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-semibold mb-1">First Name</label>
              <input id="firstName" type="text" class="w-full p-3 border-2 border-stone-300 rounded-lg" />
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">Last Name</label>
              <input id="lastName" type="text" class="w-full p-3 border-2 border-stone-300 rounded-lg" />
            </div>
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">Phone</label>
            <input id="phone" type="text" class="w-full p-3 border-2 border-stone-300 rounded-lg" placeholder="914-555-1234" />
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">Email</label>
            <input id="email" type="email" class="w-full p-3 border-2 border-stone-300 rounded-lg" placeholder="contact@example.com" />
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">Category</label>
            <select id="category" class="w-full p-3 border-2 border-stone-300 rounded-lg"></select>
          </div>
          <div class="flex items-center gap-3 py-2">
            <input id="sunnyApproved" type="checkbox" class="w-5 h-5 text-orange-500 rounded focus:ring-orange-500 border-gray-300" />
            <label for="sunnyApproved" class="text-sm font-semibold text-stone-700">☀️ Sunny Approved</label>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-semibold mb-1">Last Recommended (YYYY-MM-DD)</label>
              <input id="lastRecommended" type="text" class="w-full p-3 border-2 border-stone-300 rounded-lg" placeholder="2025-08-01" />
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">Recommendations</label>
              <input id="recommendations" type="number" min="0" class="w-full p-3 border-2 border-stone-300 rounded-lg" value="0" />
            </div>
          </div>
          <div class="flex items-center gap-3 pt-2">
            <button type="submit" class="brand-accent-bg text-white font-bold py-3 px-4 rounded-lg brand-accent-bg-hover shadow">Save</button>
            <button id="cancelBtn" type="button" class="py-3 px-4 rounded-lg border">Cancel</button>
            <button id="deleteBtn" type="button" class="py-3 px-4 rounded-lg border border-red-300 text-red-600 hidden">Delete</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="./admin.js"></script>
</body>
</html>
