<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScarsdaleBuzz // My Recommendations</title>
    <link rel="icon" type="image/png" href="images/logos/bee_favicon.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'scandi-bg': '#F2F0E9', 
                        'scandi-surface': '#FFFCF5', 
                        'scandi-text': '#282624', 
                        'scandi-muted': '#8A8580',
                        'scandi-line': '#DCD6CE', 
                        'scandi-sage': '#9FA898',
                        'scandi-clay': '#C29B8B',
                        'scandi-stone': '#A8A4A0',
                        'scandi-dark': '#1A1918',
                    },
                    fontFamily: {
                        'serif': ['Playfair Display', 'serif'],
                        'sans': ['Inter', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        'soft': '0 2px 20px rgba(40, 38, 36, 0.02)',
                        'card': '0 1px 3px rgba(0,0,0,0.05)',
                        'hover': '0 10px 40px -10px rgba(0,0,0,0.1)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F2F0E9;
            color: #282624;
            font-family: 'Inter', sans-serif;
        }

        .paper-texture {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.5;
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 50;
        }
        
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
            opacity: 0;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">
    <div class="paper-texture"></div>

    <!-- Header -->
    <div id="header-container"></div>

    <main class="flex-grow max-w-4xl w-full mx-auto p-6 pt-28 relative z-10 fade-in">
        
        <!-- Recommendations Section -->
        <div class="bg-white rounded-sm shadow-soft border border-scandi-line p-10 mb-8">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8 border-b border-scandi-line pb-4">
                <div>
                    <h3 class="font-serif text-3xl text-scandi-text mb-1">My Recommendations</h3>
                    <p class="text-scandi-muted text-sm">Manage and share your recommended providers.</p>
                </div>
                <button id="share-rolodex-btn" class="flex items-center gap-2 px-4 py-2 bg-scandi-bg border border-scandi-line rounded-sm hover:bg-scandi-clay hover:text-white transition-all group shrink-0">
                    <svg class="w-4 h-4 text-scandi-muted group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                    <span id="share-btn-text" class="text-xs font-mono uppercase tracking-widest text-scandi-text group-hover:text-white">Share All</span>
                </button>
            </div>
            
            <div id="rolodex-loading" class="text-center py-8 text-scandi-muted font-mono text-xs uppercase tracking-widest animate-pulse">Loading your picks...</div>
            <div id="rolodex-empty" class="hidden text-center py-8">
                <p class="text-scandi-muted italic mb-4">You haven't recommended anyone yet.</p>
                <a href="directory/index.html" class="inline-block px-6 py-2 border border-scandi-text text-scandi-text font-mono text-xs uppercase tracking-widest rounded-sm hover:bg-scandi-text hover:text-white transition-colors">Go to Directory</a>
            </div>
            <div id="rolodex-content" class="space-y-10 hidden">
                <!-- Injected Categories -->
            </div>
        </div>

    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="components/header.js"></script>
    <script src="components/ShareModal.js"></script>
    <script src="recommendations.js"></script>
</body>
</html>
