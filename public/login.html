<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Sunny</title>
    <link rel="icon" type="image/png" href="../images/scarsdale_services_directory.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
    </style>
</head>
<body class="bg-[#f7e9cf] min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Card -->
    <div class="bg-white p-8 md:p-12 rounded-3xl shadow-2xl w-full max-w-md text-center">
        
        <!-- Logo -->
        <div class="w-24 h-24 rounded-full bg-[#f7e9cf] p-1 mx-auto mb-6 flex items-center justify-center border-4 border-[#81503f]">
            <span class="text-4xl">🐝</span>
        </div>

        <h1 class="text-3xl font-black text-stone-800 mb-2">Welcome to Sunny</h1>
        <p class="text-stone-600 mb-8">Your AI home assistant. We vetted the pros so you don't have to.</p>

        <!-- Value Prop -->
        <div class="text-left bg-stone-50 p-6 rounded-xl mb-8 space-y-3 text-sm text-stone-700">
            <div class="flex gap-3">
                <span>⚡️</span>
                <span>Save hours of phone tag</span>
            </div>
            <div class="flex gap-3">
                <span>🛡️</span>
                <span>Trusted, vetted local providers</span>
            </div>
            <div class="flex gap-3">
                <span>💬</span>
                <span>Sunny handles the scheduling</span>
            </div>
        </div>

        <!-- Google Sign In Button -->
        <button id="google-signin-btn" class="w-full bg-white border border-stone-300 hover:bg-stone-50 text-stone-700 font-bold py-3 px-4 rounded-full transition shadow-sm hover:shadow-md flex items-center justify-center gap-3">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6 h-6" alt="Google Logo">
            <span>Sign in with Google</span>
        </button>

        <p class="text-xs text-stone-400 mt-6">By signing in, you agree to our Terms and Privacy Policy.</p>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        // Initialize Firebase
        firebase.initializeApp(window.firebaseConfig);
        const auth = firebase.auth();

        const btn = document.getElementById('google-signin-btn');
        btn.addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((result) => {
                    // Success - Redirect to Sunny
                    window.location.href = 'sunny/sunny.html';
                })
                .catch((error) => {
                    console.error("Auth Error:", error);
                    alert("Authentication failed: " + error.message);
                });
        });

        // Check if already signed in
        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.href = 'sunny/sunny.html';
            }
        });
    </script>
</body>
</html>
