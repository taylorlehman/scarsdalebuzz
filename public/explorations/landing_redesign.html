<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunny // Home Concierge</title>
    <link rel="icon" type="image/png" href="../images/logos/logo_bee_white_bg.png">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'scandi-bg': '#F2F0E9', 
                        'scandi-surface': '#FFFCF5', 
                        'scandi-text': '#282624', 
                        'scandi-muted': '#8A8580',
                        'scandi-line': '#DCD6CE', 
                        'scandi-sage': '#9FA898',
                        'scandi-clay': '#C29B8B', // Muted version of the original orange
                        'scandi-stone': '#A8A4A0',
                        'scandi-nav': 'rgba(242, 240, 233, 0.9)',
                    },
                    fontFamily: {
                        'serif': ['Playfair Display', 'serif'],
                        'sans': ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 2px 10px rgba(40, 38, 36, 0.03)',
                        'card': '0 0 0 1px rgba(40, 38, 36, 0.04), 0 2px 8px rgba(40, 38, 36, 0.04)',
                        'hover': '0 0 0 1px rgba(40, 38, 36, 0.08), 0 8px 24px rgba(40, 38, 36, 0.06)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F2F0E9;
            color: #282624;
            font-family: 'Inter', sans-serif;
        }
        
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
            opacity: 0;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .texture-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.4;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
        }

        /* Typing cursor animation */
        .typing-cursor::after {
            content: '|';
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icons = {
            ArrowRight: (props) => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>,
            Check: (props) => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="20 6 9 17 4 12"/></svg>,
            Shield: (props) => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
            Message: (props) => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>,
            Calendar: (props) => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round" {...props}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
        };

        const { ArrowRight, Check, Shield, Message, Calendar } = Icons;

        const Nav = () => (
            <nav className="fixed top-0 w-full bg-scandi-nav backdrop-blur-md z-40 px-6 py-6 border-b border-scandi-line transition-all duration-300">
                <div className="max-w-7xl mx-auto flex justify-between items-center">
                    <span className="text-sm tracking-widest uppercase text-scandi-muted font-medium">Concierge</span>

                    <div className="absolute left-1/2 transform -translate-x-1/2 text-center">
                        <h1 className="font-serif text-2xl tracking-tight text-scandi-text">Sunny<span className="text-scandi-clay">.</span></h1>
                    </div>

                    <button className="text-scandi-text hover:text-scandi-muted transition-colors text-sm font-medium border-b border-transparent hover:border-scandi-text">
                        Client Login
                    </button>
                </div>
            </nav>
        );

        const Hero = () => {
            return (
                <section className="pt-48 pb-24 px-6 max-w-7xl mx-auto">
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-20 items-center fade-in">
                        {/* Text Content */}
                        <div className="max-w-xl">
                            <span className="text-xs font-semibold tracking-[0.2em] uppercase text-scandi-clay mb-6 block">Service for Scarsdale, NY</span>
                            <h2 className="font-serif text-6xl md:text-7xl text-scandi-text leading-[1.1] mb-8">
                                Home repairs,<br />
                                <span className="italic text-scandi-muted">handled.</span>
                            </h2>
                            <p className="text-scandi-muted text-lg leading-relaxed mb-10 max-w-md border-l border-scandi-line pl-6">
                                Cease the phone tag. We coordinate the village's finest professionals, so you don't have to.
                            </p>
                            
                            {/* The "Chat" is now a sleek input */}
                            <div className="relative group max-w-md">
                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <span className="w-2 h-2 bg-scandi-clay rounded-full animate-pulse"></span>
                                </div>
                                <input 
                                    type="text" 
                                    placeholder="How can we assist your home today?" 
                                    className="w-full bg-scandi-surface border border-scandi-line/50 shadow-soft rounded-sm py-5 pl-10 pr-12 text-scandi-text placeholder-scandi-muted/60 focus:outline-none focus:border-scandi-clay transition-all duration-300 font-serif italic"
                                />
                                <button className="absolute right-2 top-1/2 -translate-y-1/2 p-2 hover:text-scandi-clay transition-colors text-scandi-text">
                                    <ArrowRight size={20} />
                                </button>
                            </div>
                        </div>

                        {/* Abstracted Chat Visual */}
                        <div className="relative h-[400px] w-full bg-scandi-surface shadow-card rounded-sm p-8 border border-scandi-line/30 flex flex-col justify-between">
                            <div className="space-y-6">
                                <div className="flex justify-between items-center border-b border-scandi-line pb-4 mb-4">
                                    <span className="text-xs uppercase tracking-widest text-scandi-muted">Ticket #9420</span>
                                    <span className="text-xs text-scandi-clay flex items-center gap-2">● Active</span>
                                </div>
                                
                                <div className="font-mono text-xs text-scandi-muted space-y-4">
                                    <p className="flex gap-4">
                                        <span className="opacity-40">10:04 AM</span>
                                        <span className="text-scandi-text">Client requested plumbing assistance.</span>
                                    </p>
                                    <p className="flex gap-4">
                                        <span className="opacity-40">10:05 AM</span>
                                        <span className="text-scandi-text">Sunny System analyzing request...</span>
                                    </p>
                                    <p className="flex gap-4">
                                        <span className="opacity-40">10:05 AM</span>
                                        <span className="text-scandi-text">Issue identified: Kitchen sink leakage.</span>
                                    </p>
                                    <p className="flex gap-4">
                                        <span className="opacity-40">10:06 AM</span>
                                        <span className="text-scandi-clay">Consulting 'Scarsdale Buzz' Vendor Network...</span>
                                    </p>
                                    <p className="flex gap-4">
                                        <span className="opacity-40">10:06 AM</span>
                                        <span className="text-scandi-text">Match found. High availability.</span>
                                    </p>
                                     <p className="flex gap-4">
                                        <span className="opacity-40">10:07 AM</span>
                                        <span className="text-scandi-text typing-cursor">Drafting schedule proposal</span>
                                    </p>
                                </div>
                            </div>

                            <div className="pt-6 border-t border-scandi-line mt-auto">
                                <div className="flex items-center justify-between text-xs text-scandi-muted">
                                    <span>Average Response: 2m 30s</span>
                                    <div className="flex items-center gap-1">
                                        <Shield size={12} />
                                        <span>Verified</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const FeatureCard = ({ icon: Icon, title, desc, num }) => (
            <div className="group p-8 border-l border-scandi-line hover:border-scandi-clay transition-colors duration-500 bg-scandi-surface/50 hover:bg-scandi-surface">
                <div className="flex justify-between items-start mb-6">
                    <span className="text-xs font-mono text-scandi-muted">{(num).toString().padStart(2, '0')}</span>
                    <Icon className="text-scandi-text group-hover:text-scandi-clay transition-colors" size={20} strokeWidth={1.5} />
                </div>
                <h3 className="font-serif text-2xl text-scandi-text mb-4">{title}</h3>
                <p className="text-sm text-scandi-muted leading-relaxed">{desc}</p>
            </div>
        );

        const Features = () => (
            <section className="bg-white py-24 border-t border-scandi-line">
                <div className="max-w-7xl mx-auto px-6">
                    <div className="mb-16 text-center max-w-2xl mx-auto">
                        <span className="text-xs font-semibold tracking-widest uppercase text-scandi-muted mb-4 block">Our Methodology</span>
                        <h2 className="font-serif text-4xl text-scandi-text">Why the community entrusts<br />their homes to Sunny.</h2>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-0 border-y border-scandi-line shadow-sm">
                        <FeatureCard 
                            num={1}
                            icon={Message}
                            title="Intelligent Dialogue"
                            desc="You speak to Sunny; Sunny speaks to the trade. We filter out the noise, ensuring contractors receive clear, technical summaries of your issue."
                        />
                        <FeatureCard 
                            num={2}
                            icon={Calendar}
                            title="Precision Logistics"
                            desc="We negotiate windows that respect your time. Appointments are synchronized directly to your calendar, removing the back-and-forth."
                        />
                        <FeatureCard 
                            num={3}
                            icon={Shield}
                            title="Curated Craftsmanship"
                            desc="We do not rely on open marketplaces. We exclusively deploy service providers vetted and recommended by the Scarsdale Buzz community."
                        />
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="py-20 px-6 max-w-7xl mx-auto flex flex-col items-center text-center">
                <h2 className="font-serif text-3xl italic text-scandi-text mb-8">Maintain your sanctuary.</h2>
                <button className="bg-scandi-text text-white px-8 py-3 text-sm tracking-widest uppercase hover:bg-scandi-clay transition-colors duration-300">
                    Initiate Request
                </button>
                <div className="mt-12 text-xs text-scandi-muted font-mono uppercase tracking-widest flex gap-4">
                    <span>Scarsdale, NY</span>
                    <span>•</span>
                    <span>© 2026 Sunny Home</span>
                </div>
            </footer>
        );

        const App = () => {
            return (
                <div className="min-h-screen flex flex-col relative selection:bg-scandi-clay selection:text-white">
                    <div className="texture-overlay"></div>
                    <Nav />
                    <Hero />
                    <Features />
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
