<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunny // Client Ledger</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'scandi-bg': '#F2F0E9', 
                        'scandi-surface': '#FFFCF5', 
                        'scandi-text': '#282624', 
                        'scandi-muted': '#8A8580',
                        'scandi-line': '#DCD6CE', 
                        'scandi-sage': '#9FA898',
                        'scandi-clay': '#C29B8B',
                        'scandi-stone': '#A8A4A0',
                        'scandi-dark': '#1A1918',
                    },
                    fontFamily: {
                        'serif': ['Playfair Display', 'serif'],
                        'sans': ['Inter', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        'soft': '0 2px 20px rgba(40, 38, 36, 0.02)',
                        'card': '0 1px 3px rgba(0,0,0,0.05)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F2F0E9;
            color: #282624;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
            opacity: 0;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #DCD6CE;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #C29B8B;
        }

        .paper-texture {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.5;
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 50;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons ---
        const Icons = {
            Plus: (props) => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            MoreVertical: (props) => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>,
            Send: (props) => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
            Clock: (props) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            CheckCircle: (props) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            ArrowLeft: (props) => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>,
            File: (props) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>,
        };

        const { Plus, MoreVertical, Send, Clock, CheckCircle, ArrowLeft, File } = Icons;

        // --- Data ---
        const REQUESTS = [
            { id: 1, title: "Emergency Frozen Pipes", status: "Active", date: "Today", preview: "Connecting with Pete's Plumbing..." },
            { id: 2, title: "Gutter Cleaning", status: "Pending", date: "Oct 24", preview: "Awaiting your confirmation." },
            { id: 3, title: "Kitchen Remodel", status: "Draft", date: "Sep 12", preview: "Notes saved." },
        ];

        const CHAT_HISTORY = [
            { id: 1, sender: 'user', text: "My pipes in the basement froze. I need someone today, and I'm available between 3-5PM.", time: "11:04 AM" },
            { id: 2, sender: 'system', text: "Request acknowledged. Priority: Critical. Analyzing vendor availability in Scarsdale...", time: "11:04 AM" },
            { id: 3, sender: 'sunny', text: "I'm on it! I've contacted Pete's Plumbing to see if they can help. I'll let you know as soon as I hear back.", time: "11:05 AM" },
        ];

        // --- Components ---

        const SidebarItem = ({ req, isActive, onClick }) => (
            <div 
                onClick={onClick}
                className={`group p-4 rounded-sm cursor-pointer transition-all duration-300 border-l-2 ${isActive ? 'bg-white border-scandi-clay shadow-soft' : 'bg-transparent border-transparent hover:bg-white/50 hover:border-scandi-line'}`}
            >
                <div className="flex justify-between items-start mb-1">
                    <h3 className={`font-serif text-lg leading-tight ${isActive ? 'text-scandi-text' : 'text-scandi-muted group-hover:text-scandi-text'}`}>
                        {req.title}
                    </h3>
                    {isActive && <div className="w-1.5 h-1.5 rounded-full bg-scandi-clay mt-2"></div>}
                </div>
                <div className="flex justify-between items-center text-xs">
                    <span className={`uppercase tracking-widest font-medium ${isActive ? 'text-scandi-clay' : 'text-scandi-muted'}`}>{req.status}</span>
                    <span className="font-mono text-scandi-muted opacity-60">{req.date}</span>
                </div>
            </div>
        );

        const Message = ({ msg }) => {
            const isUser = msg.sender === 'user';
            const isSystem = msg.sender === 'system';

            if (isSystem) {
                return (
                    <div className="flex gap-4 py-4 opacity-70 fade-in">
                        <div className="w-8 flex-shrink-0 flex justify-center pt-1">
                            <span className="font-mono text-[10px] text-scandi-muted">SYS</span>
                        </div>
                        <div className="flex-grow border-l border-scandi-line pl-6 font-mono text-xs text-scandi-muted leading-relaxed uppercase tracking-wide">
                            {msg.text}
                        </div>
                    </div>
                );
            }

            return (
                <div className={`flex gap-4 py-6 fade-in group ${isUser ? '' : 'bg-scandi-bg/30 -mx-8 px-8'}`}>
                    {/* Avatar / Label */}
                    <div className="w-8 flex-shrink-0 pt-1">
                        {isUser ? (
                            <div className="w-8 h-8 rounded-full bg-scandi-text text-white flex items-center justify-center font-serif italic text-sm">TL</div>
                        ) : (
                            <div className="w-8 h-8 rounded-full bg-scandi-clay text-white flex items-center justify-center">
                                <span className="font-bold text-xs">S</span>
                            </div>
                        )}
                    </div>

                    {/* Content */}
                    <div className="flex-grow max-w-2xl">
                        <div className="flex items-baseline justify-between mb-2">
                            <span className={`text-sm font-medium tracking-wide ${isUser ? 'text-scandi-text' : 'text-scandi-clay'}`}>
                                {isUser ? 'Taylor Lehman' : 'Sunny'}
                            </span>
                            <span className="text-xs font-mono text-scandi-muted opacity-0 group-hover:opacity-100 transition-opacity">
                                {msg.time}
                            </span>
                        </div>
                        <p className={`text-base leading-relaxed ${isUser ? 'font-serif text-scandi-text' : 'font-sans text-scandi-text'}`}>
                            {msg.text}
                        </p>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeReqId, setActiveReqId] = useState(1);
            const [messages, setMessages] = useState(CHAT_HISTORY);
            const [input, setInput] = useState("");
            const chatEndRef = useRef(null);

            const handleSend = (e) => {
                e.preventDefault();
                if (!input.trim()) return;
                
                const newMsg = {
                    id: messages.length + 1,
                    sender: 'user',
                    text: input,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                setMessages([...messages, newMsg]);
                setInput("");
                
                // Mock system response
                setTimeout(() => {
                    setMessages(prev => [...prev, {
                        id: prev.length + 1,
                        sender: 'sunny',
                        text: "I've updated the ticket. Is there anything else you need to add?",
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    }]);
                }, 1000);
            };

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages]);

            return (
                <div className="flex h-screen w-full relative">
                    <div className="paper-texture"></div>

                    {/* Sidebar / Docket */}
                    <aside className="w-80 border-r border-scandi-line flex flex-col bg-scandi-bg z-10">
                        {/* Sidebar Header */}
                        <div className="p-6 border-b border-scandi-line">
                            <div className="flex items-center gap-3 mb-6">
                                <div className="w-3 h-3 bg-scandi-clay rounded-full"></div>
                                <h1 className="font-serif text-xl tracking-tight text-scandi-text">Sunny<span className="italic text-scandi-muted">Ledger</span></h1>
                            </div>
                            <button className="w-full flex items-center justify-center gap-2 bg-white border border-scandi-line text-scandi-text py-3 text-sm font-medium tracking-wide hover:border-scandi-clay hover:text-scandi-clay transition-all shadow-sm rounded-sm">
                                <Plus size={16} /> New Request
                            </button>
                        </div>

                        {/* List */}
                        <div className="flex-grow overflow-y-auto p-4 space-y-2">
                            <div className="text-xs font-mono uppercase tracking-widest text-scandi-muted px-4 mb-2 mt-2">Active Matters</div>
                            {REQUESTS.map(req => (
                                <SidebarItem 
                                    key={req.id} 
                                    req={req} 
                                    isActive={activeReqId === req.id}
                                    onClick={() => setActiveReqId(req.id)}
                                />
                            ))}
                        </div>

                        {/* User Profile Stub */}
                        <div className="p-6 border-t border-scandi-line flex items-center gap-3">
                            <div className="w-8 h-8 rounded-full bg-scandi-stone text-white flex items-center justify-center font-serif italic">T</div>
                            <div className="flex-grow">
                                <div className="text-sm font-medium text-scandi-text">Taylor Lehman</div>
                                <div className="text-xs text-scandi-muted">Premium Member</div>
                            </div>
                            <MoreVertical size={16} className="text-scandi-muted cursor-pointer" />
                        </div>
                    </aside>

                    {/* Main Workspace */}
                    <main className="flex-grow flex flex-col bg-scandi-surface z-10 relative">
                        {/* Header */}
                        <header className="h-20 border-b border-scandi-line flex items-center justify-between px-8 bg-white/50 backdrop-blur-sm sticky top-0">
                            <div className="flex items-center gap-4">
                                <span className="font-mono text-xs text-scandi-muted border border-scandi-line px-2 py-1 rounded-sm">REF-2024-001</span>
                                <h2 className="font-serif text-2xl text-scandi-text">Emergency Frozen Pipes</h2>
                                <span className="flex items-center gap-1 text-xs font-medium text-scandi-clay bg-scandi-clay/10 px-3 py-1 rounded-full">
                                    <Clock size={12} /> Active
                                </span>
                            </div>
                            <div className="flex items-center gap-4 text-scandi-muted">
                                <button className="hover:text-scandi-text transition-colors"><File size={18} /></button>
                                <div className="h-4 w-px bg-scandi-line"></div>
                                <button className="hover:text-scandi-text transition-colors"><MoreVertical size={18} /></button>
                            </div>
                        </header>

                        {/* Chat / Transcript Area */}
                        <div className="flex-grow overflow-y-auto p-8 lg:px-16">
                            <div className="max-w-4xl mx-auto">
                                <div className="text-center mb-12">
                                    <span className="bg-scandi-bg px-4 py-1 rounded-full text-xs font-mono text-scandi-muted uppercase tracking-widest">
                                        Today, October 24
                                    </span>
                                </div>
                                {messages.map(msg => (
                                    <Message key={msg.id} msg={msg} />
                                ))}
                                <div ref={chatEndRef} />
                            </div>
                        </div>

                        {/* Composer Area */}
                        <div className="p-8 lg:px-16 bg-white border-t border-scandi-line">
                            <div className="max-w-4xl mx-auto">
                                <form onSubmit={handleSend} className="relative group">
                                    <textarea 
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        placeholder="Type a new message to Sunny..."
                                        className="w-full bg-scandi-bg/30 border border-scandi-line rounded-sm p-4 pr-16 text-scandi-text placeholder-scandi-muted focus:outline-none focus:border-scandi-clay focus:bg-white transition-all resize-none font-serif text-lg h-24"
                                        onKeyDown={(e) => {
                                            if (e.key === 'Enter' && !e.shiftKey) {
                                                e.preventDefault();
                                                handleSend(e);
                                            }
                                        }}
                                    />
                                    <button 
                                        type="submit"
                                        className={`absolute bottom-4 right-4 p-2 rounded-sm transition-all duration-300 ${input.trim() ? 'bg-scandi-text text-white hover:bg-scandi-clay' : 'bg-transparent text-scandi-line cursor-default'}`}
                                    >
                                        <Send size={18} />
                                    </button>
                                </form>
                                <div className="mt-2 text-xs text-scandi-muted flex justify-between items-center font-mono">
                                    <span>Press Enter to send</span>
                                    <span>Sunny Status: Online ●</span>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
