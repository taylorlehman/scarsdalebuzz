<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScarsdaleBuzz // Account</title>
    <link rel="icon" type="image/png" href="images/logos/logo_bee_white_bg.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'scandi-bg': '#F2F0E9', 
                        'scandi-surface': '#FFFCF5', 
                        'scandi-text': '#282624', 
                        'scandi-muted': '#8A8580',
                        'scandi-line': '#DCD6CE', 
                        'scandi-sage': '#9FA898',
                        'scandi-clay': '#C29B8B',
                        'scandi-stone': '#A8A4A0',
                        'scandi-dark': '#1A1918',
                    },
                    fontFamily: {
                        'serif': ['Playfair Display', 'serif'],
                        'sans': ['Inter', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        'soft': '0 2px 20px rgba(40, 38, 36, 0.02)',
                        'card': '0 1px 3px rgba(0,0,0,0.05)',
                        'hover': '0 10px 40px -10px rgba(0,0,0,0.1)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F2F0E9;
            color: #282624;
            font-family: 'Inter', sans-serif;
        }

        .paper-texture {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.5;
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 50;
        }
        
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
            opacity: 0;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">
    <div class="paper-texture"></div>

    <!-- Header -->
    <div id="header-container"></div>

    <main class="flex-grow max-w-2xl w-full mx-auto p-6 pt-28 relative z-10 fade-in">
        
        <!-- Profile Card -->
        <div class="bg-white rounded-sm shadow-soft border border-scandi-line p-10 mb-8 flex flex-col items-center text-center">
            <img id="account-user-photo" src="" alt="Profile" class="w-24 h-24 rounded-full mb-6 border border-scandi-line object-cover p-1 bg-scandi-bg">
            <h2 id="account-user-name" class="font-serif text-3xl text-scandi-text mb-2">...</h2>
            <p id="user-email" class="text-scandi-muted font-mono text-xs uppercase tracking-widest mb-8">...</p>
            
            <div class="inline-flex items-center gap-2 px-4 py-2 bg-scandi-bg border border-scandi-line rounded-full">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-4 h-4 opacity-70">
                <span class="text-xs font-mono text-scandi-muted uppercase tracking-wider">Signed in with Google</span>
            </div>
        </div>

        <!-- Contact Details -->
        <div class="bg-white rounded-sm shadow-soft border border-scandi-line p-10 mb-8">
            <h3 class="font-serif text-2xl text-scandi-text mb-8 border-b border-scandi-line pb-4">Contact Details</h3>
            
            <div class="mb-6">
                <label class="block text-xs font-mono text-scandi-muted uppercase tracking-widest mb-2">Home Address</label>
                <input type="text" id="address-input" placeholder="e.g. 123 Scarsdale Blvd" class="w-full p-4 border border-scandi-line bg-scandi-bg/30 rounded-sm focus:outline-none focus:border-scandi-clay font-serif text-scandi-text transition-colors">
            </div>
            
            <div class="mb-10">
                <label class="block text-xs font-mono text-scandi-muted uppercase tracking-widest mb-2">Phone Number</label>
                <input type="tel" id="phone-input" placeholder="+1 (914) 555-0123" class="w-full p-4 border border-scandi-line bg-scandi-bg/30 rounded-sm focus:outline-none focus:border-scandi-clay font-serif text-scandi-text transition-colors">
            </div>
            
            <button id="save-btn" class="w-full bg-scandi-text hover:bg-scandi-clay text-white font-mono text-xs uppercase tracking-[0.2em] py-4 rounded-sm transition-all duration-300 shadow-sm hover:shadow-md">
                Update Profile
            </button>
            <p id="save-msg" class="text-center text-xs font-mono mt-4 hidden"></p>
        </div>

        <!-- Danger Zone -->
        <div class="bg-white rounded-sm shadow-soft border border-scandi-line p-10 mb-8 opacity-80 hover:opacity-100 transition-opacity">
            <h3 class="font-serif text-xl text-scandi-text mb-4">Danger Zone</h3>
            <p class="text-scandi-muted mb-8 text-sm leading-relaxed">Once you delete your account, there is no going back. All your requests and chat history will be permanently removed.</p>
            
            <a id="delete-btn" href="#" class="block w-full text-center text-red-800/70 hover:text-red-800 text-xs font-mono uppercase tracking-widest border border-transparent hover:border-red-200 hover:bg-red-50 py-3 transition-colors">
                Delete Account
            </a>
        </div>
        
        <div class="mt-12 mb-20 text-center">
            <button id="account-sign-out-btn" class="text-scandi-muted hover:text-scandi-text text-xs font-mono uppercase tracking-widest border-b border-transparent hover:border-scandi-muted transition-all">Sign Out</button>
        </div>

    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="components/header.js"></script>

    <script>
        // Initialize Shared Header
        document.addEventListener('DOMContentLoaded', () => {
            new SharedHeader({
                activePage: 'account',
                rootPath: './'
            });
        });

        firebase.initializeApp(window.firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const addressInput = document.getElementById('address-input');
        const phoneInput = document.getElementById('phone-input');
        const saveBtn = document.getElementById('save-btn');
        const saveMsg = document.getElementById('save-msg');

        // Phone formatter helper
        window.formatPhoneNumber = (value) => {
            if (!value) return value;
            const phoneNumber = value.replace(/[^\d]/g, '');
            const phoneNumberLength = phoneNumber.length;
            if (phoneNumberLength < 4) return phoneNumber;
            if (phoneNumberLength < 7) {
                return `(${phoneNumber.slice(0, 3)}) ${phoneNumber.slice(3)}`;
            }
            return `(${phoneNumber.slice(0, 3)}) ${phoneNumber.slice(3, 6)}-${phoneNumber.slice(6, 10)}`;
        };

        phoneInput.addEventListener('input', (e) => {
            const formatted = window.formatPhoneNumber(e.target.value);
            e.target.value = formatted;
        });

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                // Display Basic Info
                document.getElementById('account-user-name').textContent = user.displayName;
                document.getElementById('user-email').textContent = user.email;
                if (user.photoURL) {
                    document.getElementById('account-user-photo').src = user.photoURL;
                }
                
                // Configure Delete Button
                const subject = encodeURIComponent("Please delete my account");
                const body = encodeURIComponent(`I request to delete my account associated with email: ${user.email}. \n\nUID: ${user.uid}`);
                const mailto = `mailto:taylor@tl-labs.com?subject=${subject}&body=${body}`;
                document.getElementById('delete-btn').href = mailto;

                // Fetch Profile Data
                try {
                    const doc = await db.collection('users').doc(user.uid).get();
                    if (doc.exists) {
                        const data = doc.data();
                        if (data.address) addressInput.value = data.address;
                        if (data.phoneNumber) phoneInput.value = data.phoneNumber;
                    }
                } catch (error) {
                    console.error("Error fetching profile:", error);
                }

                // Handle Save
                saveBtn.addEventListener('click', async () => {
                    saveBtn.disabled = true;
                    saveBtn.textContent = 'Saving...';
                    saveMsg.classList.add('hidden');

                    try {
                        await db.collection('users').doc(user.uid).set({
                            address: addressInput.value.trim(),
                            phoneNumber: phoneInput.value.trim(),
                            email: user.email,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        }, { merge: true });

                        saveBtn.textContent = 'Saved';
                        saveMsg.textContent = 'Profile updated successfully.';
                        saveMsg.className = 'text-center text-xs font-mono mt-4 text-scandi-sage uppercase tracking-wider';
                        saveMsg.classList.remove('hidden');

                        setTimeout(() => {
                            saveBtn.disabled = false;
                            saveBtn.textContent = 'Update Profile';
                            saveMsg.classList.add('hidden');
                        }, 2000);

                    } catch (error) {
                        console.error("Error saving profile:", error);
                        saveBtn.textContent = 'Update Profile';
                        saveBtn.disabled = false;
                        saveMsg.textContent = 'Error saving profile.';
                        saveMsg.className = 'text-center text-xs font-mono mt-4 text-red-800 uppercase tracking-wider';
                        saveMsg.classList.remove('hidden');
                    }
                });
                
            } else {
                // Not signed in, redirect to login
                window.location.href = 'login.html';
            }
        });

        document.getElementById('account-sign-out-btn').addEventListener('click', () => {
            auth.signOut().then(() => {
                window.location.href = 'login.html';
            });
        });
    </script>
</body>
</html>
